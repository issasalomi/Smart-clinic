<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العيادة الذكية</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#163e43;background:#f2f9f8}*{box-sizing:border-box}body{margin:0}header{background:#008f95;color:white;padding:17px 25px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:23px}header small{display:block;margin-top:5px;color:#d8ffff}.layout{display:flex;min-height:calc(100vh - 78px)}aside{width:235px;background:#104b50;color:white;padding:16px;flex-shrink:0}aside button{display:block;width:100%;text-align:right;background:transparent;color:white;border:0;padding:13px;border-radius:9px;cursor:pointer;font-size:15px}aside button.active,aside button:hover{background:#008f95}main{flex:1;min-width:0;padding:26px;max-width:1450px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 16px}.muted{color:#658084}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.card,.panel{background:white;border:1px solid #d9eae8;border-radius:14px;padding:19px;box-shadow:0 3px 10px #06484a09}.card b{font-size:27px;display:block;color:#007c83;margin-top:12px}.panel{margin-top:17px}button.primary{background:#008f95;color:white;border:0;padding:11px 17px;border-radius:9px;cursor:pointer}button.secondary{background:#e0f4f1;color:#006b72;border:0;padding:10px 14px;border-radius:9px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:bold}input,select,textarea{width:100%;border:1px solid #bdd8d6;border-radius:8px;padding:11px;font:inherit;background:white;color:#163e43}textarea{min-height:75px}form{display:grid;gap:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;min-width:580px}th,td{padding:12px;text-align:right;border-bottom:1px solid #e3efed;font-size:14px}th{background:#e9f7f5}.scroll{overflow:auto}.notice{background:#fff6df;border:1px solid #f0d9a1;padding:12px;border-radius:9px;margin:12px 0;color:#71541b}.success{color:#007b63}.error{color:#b32727}.hidden{display:none}.pill{background:#def5f2;padding:5px 10px;border-radius:20px;font-size:12px}#toast{position:fixed;bottom:20px;left:20px;padding:12px 20px;background:#174b50;color:white;border-radius:10px;display:none;z-index:3}a{color:#007e85;cursor:pointer}footer{margin-top:24px;color:#6d8588;font-size:12px}@media(max-width:850px){.layout{display:block}aside{width:100%;display:flex;overflow-x:auto;padding:8px;gap:4px}aside button{white-space:nowrap;width:auto;font-size:13px}main{padding:14px}.cards,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header strong{font-size:18px}}@media(max-width:480px){.cards,.grid{grid-template-columns:1fr}.card b{font-size:22px}}
</style></head><body><header><div><strong>✚ العيادة الذكية <span style="font-size:13px">Smart Clinic</span></strong><small>خبير التغذية الوظيفية عيسى توما سلومي</small></div><span class="pill" style="color:#005f65">نسخة أولية محلية</span></header><div class="layout"><aside id="nav"></aside><main><div id="page"></div><footer>هذه نسخة تجريبية لحفظ البيانات وإدارة العمل؛ ليست مهيأة بعد لبيانات مرضى حقيقية أو لاعتماد توصيات سريرية.</footer></main></div><div id="toast"></div><script>
const items=[['dashboard','⌂','لوحة التحكم'],['patients','♙','المراجعون'],['visits','▤','الزيارات'],['labs','⚗','التحاليل'],['plans','✧','الخطط الغذائية'],['products','▣','المخزن'],['invoices','▤','الفواتير']];let current='dashboard';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const field=(label,name,type='text',value='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${type==='date'?'required':''}></label>`;const select=(label,name,opts)=>`<label class="field">${label}<select name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`;const text=(label,name)=>`<label class="field">${label}<textarea name="${name}"></textarea></label>`;const card=(label,val)=>`<div class="card">${label}<b>${esc(val)}</b></div>`;
async function api(path,options){const r=await fetch('/api/'+path,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.detail||'حدث خطأ');return d}
function notify(message,bad=false){const t=$('toast');t.textContent=message;t.style.background=bad?'#a92e2e':'#174b50';t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function menu(){ $('nav').innerHTML=items.map(([id,icon,label])=>`<button class="${current===id?'active':''}" onclick="show('${id}')">${icon} &nbsp; ${label}</button>`).join('') }
async function show(name){current=name;menu();$('page').innerHTML='<p class="muted">جارٍ التحميل...</p>';try{if(name==='dashboard')await dashboard();if(name==='patients')await patients();if(name==='visits')await visits();if(name==='labs')await labs();if(name==='plans')await plans();if(name==='products')await products();if(name==='invoices')await invoices()}catch(e){$('page').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function formData(id){const data=Object.fromEntries(new FormData($(id)));for(const [k,v] of Object.entries(data))if(v==='')delete data[k];return data}
async function submit(id,endpoint,transform){try{const data=formData(id);if(transform)transform(data);await api(endpoint,{method:'POST',body:JSON.stringify(data)});notify('تم الحفظ في قاعدة البيانات');show(current)}catch(e){notify(e.message,true)}}
async function patientOptions(){const ps=await api('patients');return ps.map(p=>[p.id,`${p.id} – ${p.name}`])}
function table(head,body){return `<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${head.length}">لا توجد سجلات بعد</td></tr>`}</tbody></table></div>`}
async function dashboard(){const d=await api('dashboard');$('page').innerHTML=`<h1>لوحة التحكم</h1><p class="muted">نظرة عامة على بيانات العيادة المحفوظة</p><div class="cards">${card('المراجعون',d.patients)}${card('الزيارات',d.visits)}${card('الخطط',d.plans)}${card('منتجات المخزن',d.products)}${card('إجمالي الكشفيات (د.ع)',d.consultations_iqd.toLocaleString())}${card('إجمالي المبيعات (د.ع)',d.sales_iqd.toLocaleString())}</div><div class="panel"><h2>ابدأ العمل</h2><div class="actions"><button class="primary" onclick="show('patients')">إضافة مراجع</button><button class="secondary" onclick="show('visits')">تسجيل زيارة</button><button class="secondary" onclick="show('plans')">إنشاء خطة</button></div></div><div class="notice">تنبيه: لا يوجد تسجيل دخول أو صلاحيات أو تشفير ملفات أو ذكاء اصطناعي فعلي في هذه النسخة. استخدم بيانات تجريبية فقط.</div>`}
async function patients(){const ps=await api('patients');$('page').innerHTML=`<h1>المراجعون</h1><div class="panel"><h2>مراجع جديد</h2><form id="patientForm" onsubmit="event.preventDefault();submit('patientForm','patients')"><div class="grid">${field('الاسم الكامل *','name')}${field('رقم الهاتف','phone')}${select('الجنس','gender',[['','غير محدد'],['ذكر','ذكر'],['أنثى','أنثى']])}${field('سنة الميلاد','birth_year','number')}${select('المهنة','occupation',[['','اختر'],['موظف','موظف'],['طالب','طالب'],['أعمال حرة','أعمال حرة'],['متقاعد','متقاعد'],['ربة منزل','ربة منزل'],['أخرى','أخرى']])}${field('البلد','country','text','العراق')}${field('المحافظة','governorate')}${field('المنطقة','area')}</div><button class="primary">حفظ المراجع</button></form></div><div class="panel"><h2>السجل الموحد</h2>${table(['الرقم','الاسم','الهاتف','المحافظة','الملف'],ps.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(p.governorate)}</td><td><button class="secondary" onclick="detail(${p.id})">فتح</button></td></tr>`).join(''))}</div>`}
async function detail(id){try{const d=await api('patients/'+id),p=d.patient;$('page').innerHTML=`<div class="toolbar"><h1>${esc(p.name)} <span class="pill">P-${p.id}</span></h1><button class="secondary" onclick="show('patients')">عودة</button></div><p class="muted">${esc(p.phone)} | ${esc(p.country)} – ${esc(p.governorate)} – ${esc(p.area)}</p><div class="cards">${card('الزيارات',d.visits.length)}${card('التحاليل',d.labs.length)}${card('الخطط',d.plans.length)}</div><div class="panel"><h2>الزيارات والقياسات</h2>${table(['التاريخ','النوع','السبب','الوزن','BMI'],d.visits.map(v=>`<tr><td>${esc(v.visit_date)}</td><td>${esc(v.visit_type)}</td><td>${esc(v.reason)}</td><td>${esc(v.weight??'—')}</td><td>${v.weight&&v.height?(v.weight/(v.height/100)**2).toFixed(1):'—'}</td></tr>`).join(''))}</div><div class="panel"><h2>التحاليل</h2>${table(['التاريخ','التحليل','النتيجة','الوحدة','المرجع'],d.labs.map(v=>`<tr><td>${esc(v.test_date)}</td><td>${esc(v.test_name)}</td><td>${esc(v.value)}</td><td>${esc(v.unit)}</td><td>${esc(v.reference_range)}</td></tr>`).join(''))}</div><div class="panel"><h2>الخطط</h2>${table(['رقم','الطريقة','الهدف','الأيام','الحالة'],d.plans.map(v=>`<tr><td>${v.id}</td><td>${esc(v.mode)}</td><td>${esc(v.goal)}</td><td>${v.duration_days}</td><td>${esc(v.status)}</td></tr>`).join(''))}</div>`}catch(e){notify(e.message,true)}}
async function visits(){const opts=await patientOptions();$('page').innerHTML=`<h1>الزيارات</h1><div class="panel"><h2>إضافة زيارة</h2>${!opts.length?'<div class="notice">أضف مراجعاً أولاً.</div>':`<form id="visitForm" onsubmit="event.preventDefault();submit('visitForm','visits',d=>{for(let k of ['patient_id','weight','height','waist'])if(d[k]!=null)d[k]=Number(d[k])})"><div class="grid">${select('المراجع','patient_id',opts)}${select('نوع الزيارة','visit_type',[['جديد','جديد'],['متابعة','متابعة'],['استشارة','استشارة']])}${field('التاريخ','visit_date','date',today())}${field('سبب الزيارة','reason')}${field('الوزن (كغم)','weight','number')}${field('الطول (سم)','height','number')}${field('محيط الخصر (سم)','waist','number')}</div>${text('ملاحظات','notes')}<button class="primary">حفظ الزيارة</button></form>`}</div>`}
async function labs(){const opts=await patientOptions();$('page').innerHTML=`<h1>التحاليل المختبرية</h1><div class="panel"><h2>إدخال نتيجة تحليل</h2><p class="muted">قراءة PDF والصور تلقائياً ستضاف في مرحلة لاحقة؛ حالياً الإدخال يدوي.</p>${!opts.length?'<div class="notice">أضف مراجعاً أولاً.</div>':`<form id="labForm" onsubmit="event.preventDefault();submit('labForm','labs',d=>d.patient_id=Number(d.patient_id))"><div class="grid">${select('المراجع','patient_id',opts)}${field('اسم التحليل','test_name')}${field('النتيجة','value')}${field('الوحدة','unit')}${field('المدى المرجعي','reference_range')}${field('تاريخ التحليل','test_date','date',today())}</div><button class="primary">حفظ التحليل</button></form>`}</div>`}
async function plans(){const opts=await patientOptions();$('page').innerHTML=`<h1>الخطط الغذائية المتكاملة</h1><div class="notice">الإنشاء التلقائي بالذكاء الاصطناعي غير متصل بعد. خيار «تلقائي» و«مدمج» يحفظان طريقة العمل المطلوبة فقط، ولا يولدان توصيات سريرية في هذه النسخة.</div><div class="panel"><h2>مسودة خطة جديدة</h2>${!opts.length?'<div class="notice">أضف مراجعاً أولاً.</div>':`<form id="planForm" onsubmit="event.preventDefault();submit('planForm','plans',d=>{for(let k of ['patient_id','duration_days','calories','protein','carbs','fat','fiber'])if(d[k]!=null)d[k]=Number(d[k])})"><div class="grid">${select('المراجع','patient_id',opts)}${select('طريقة الإنشاء','mode',[['hybrid','مدمج'],['manual','يدوي'],['auto','تلقائي – غير مفعل']])}${field('الهدف','goal')}${field('عدد الأيام','duration_days','number',7)}${field('السعرات kcal','calories','number')}${field('البروتين غ','protein','number')}${field('الكربوهيدرات غ','carbs','number')}${field('الدهون غ','fat','number')}${field('الألياف غ','fiber','number')}</div>${text('الوجبات والأطعمة والكميات','meals')}${text('المكملات – مسودة للمراجعة','supplements')}${text('الأعشاب – مسودة للمراجعة','herbs')}${text('النوم والنشاط والعادات','lifestyle')}<button class="primary">حفظ مسودة الخطة</button></form>`}</div>`}
async function products(){const ps=await api('products');$('page').innerHTML=`<h1>المخزن والأعشاب والمكملات</h1><div class="panel"><h2>منتج جديد</h2><form id="productForm" onsubmit="event.preventDefault();submit('productForm','products',d=>{d.quantity=Number(d.quantity||0);d.price_iqd=Number(d.price_iqd||0)})"><div class="grid">${field('اسم المنتج','name')}${select('التصنيف','category',[['عشبة','عشبة'],['مكمل','مكمل'],['منتج آخر','منتج آخر']])}${select('الشكل','form',[['كبسولات','كبسولات'],['مسحوق','مسحوق'],['سائل','سائل'],['أخرى','أخرى']])}${select('وحدة المخزون','unit',[['كبسولة','كبسولة'],['غرام','غرام'],['مل','مل'],['عبوة','عبوة']])}${field('الكمية','quantity','number',0)}${field('سعر الوحدة (د.ع)','price_iqd','number',0)}</div><button class="primary">حفظ المنتج</button></form></div><div class="panel"><h2>المنتجات الحالية</h2>${table(['الاسم','التصنيف','الشكل','الكمية','السعر'],ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.form)}</td><td>${p.quantity} ${esc(p.unit)}</td><td>${p.price_iqd.toLocaleString()} د.ع</td></tr>`).join(''))}</div>`}
async function invoices(){const ps=await api('invoices'),opts=[['','بدون ربط'],...(await patientOptions())];$('page').innerHTML=`<h1>الفواتير</h1><p class="muted">الكشفيات ومبيعات المنتجات مفصولتان في التصنيف والتقارير.</p><div class="panel"><h2>تسجيل فاتورة</h2><form id="invoiceForm" onsubmit="event.preventDefault();submit('invoiceForm','invoices',d=>{if(d.patient_id)d.patient_id=Number(d.patient_id);d.amount_iqd=Number(d.amount_iqd)})"><div class="grid">${select('نوع الفاتورة','invoice_type',[['consultation','كشفية / استشارة'],['product','بيع منتجات']])}${select('المراجع','patient_id',opts)}${field('المبلغ (د.ع)','amount_iqd','number')}</div>${text('ملاحظات','notes')}<button class="primary">حفظ الفاتورة</button></form></div><div class="panel"><h2>السجل المالي</h2>${table(['الرقم','النوع','المبلغ','التاريخ'],ps.map(v=>`<tr><td>${v.id}</td><td>${v.invoice_type==='consultation'?'كشفية':'منتجات'}</td><td>${v.amount_iqd.toLocaleString()} د.ع</td><td>${esc(v.created_at)}</td></tr>`).join(''))}</div><div class="notice">فواتير المنتجات في هذه النسخة تسجيل مالي أولي فقط؛ لا تخصم المخزون تلقائياً قبل تنفيذ نظام بنود الفواتير والدفعات.</div>`}
show('dashboard');
</script></body></html>
